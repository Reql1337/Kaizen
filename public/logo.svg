<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3f5a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="percentSplit" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="47%" stop-color="#ffffff"/>
      <stop offset="47.1%" stop-color="#f5b82e"/>
      <stop offset="100%" stop-color="#f5b82e"/>
    </linearGradient>
    <clipPath id="glossClip">
      <rect x="24" y="24" width="352" height="352" rx="72"/>
    </clipPath>
  </defs>

  <!-- Outline Border -->
  <rect x="20" y="20" width="360" height="360" rx="76" fill="url(#borderGrad)"/>
  
  <!-- Main Background Inner -->
  <rect x="24" y="24" width="352" height="352" rx="72" fill="url(#bgGrad)"/>
  
  <!-- Gloss highlight overlay -->
  <path d="M 0 0 L 400 0 L 400 180 Q 200 130 0 240 Z" fill="#ffffff" opacity="0.1" clip-path="url(#glossClip)"/>
  <path d="M 0 0 L 400 0 L 400 180 Q 200 130 0 240 Z" fill="#ffffff" opacity="0.05" clip-path="url(#glossClip)"/>

  <!-- Text 1% -->
  <g transform="translate(45, 290)">
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="240" font-weight="900" fill="#ffffff" letter-spacing="-15">1</text>
    <text x="140" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="240" font-weight="900" fill="url(#percentSplit)" letter-spacing="-10">%</text>
  </g>
</svg>
